[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backfire"
version = "0.1.0"
description = "Finds retry amplification and timeout blowups in Python codebases."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [{ name = "ACHANTI Sri Vardhan" }]
keywords = ["retry", "static-analysis", "linter", "resilience", "sre", "timeout"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guthib241/pebble"
Issues = "https://github.com/guthib241/pebble/issues"

[project.scripts]
backfire = "backfire.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["backfire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
